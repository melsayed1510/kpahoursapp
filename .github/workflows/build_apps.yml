name: Build Native Android APK and iOS

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Native APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Platform Files
        run: |
          rm -rf android ios
          flutter create --org com.kpahours --project-name kpa_shift_app .

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kpa-Work-Time-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Kpa Work Time - تطبيق أندرويد خام (Native APK)"
          body: |
            ### 📱 تطبيق Kpa Work Time (Pure Native Flutter APK)
            - حاسبة مواعيد البصمة وإثبات التواجد وسقف الدوام والتأخير.
            - جدول النوبات التفاعلي السنوي والشهري مع استعلام نوبة أي تاريخ.
            - اضغط على **`app-release.apk`** بالأسفل للتحميل والتثبيت المباشر على الهاتف بدون متصفح.
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Platform Files
        run: |
          rm -rf android ios
          flutter create --org com.kpahours --project-name kpa_shift_app .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS (No codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Payload
        uses: actions/upload-artifact@v4
        with:
          name: KPA-Shift-Tracker-iOS
          path: build/ios/iphoneos
